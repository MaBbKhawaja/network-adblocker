# Invidious: a private, ad-free YouTube front-end for the whole home.
# Three containers: the Invidious web app, its "companion" (talks to YouTube and handles
# Google's anti-bot checks), and Postgres. Secrets and image tags come from .env (gitignored).
# Usage: ./setup.sh   (or: docker compose up -d)   then open http://<host>:3000
services:
  invidious:
    image: quay.io/invidious/invidious:${INVIDIOUS_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"          # LAN-reachable on purpose; this is a home network
    environment:
      INVIDIOUS_CONFIG: |
        db:
          dbname: invidious
          user: kemal
          password: kemal
          host: invidious-db
          port: 5432
        check_tables: true
        invidious_companion:
          - private_url: "http://companion:8282/companion"
        invidious_companion_key: "${COMPANION_KEY}"
        hmac_key: "${HMAC_KEY}"
        https_only: false
        statistics_enabled: false
        registration_enabled: true
        login_enabled: true
        default_user_preferences:
          quality: dash
          autoplay: false
          region: GB
    healthcheck:
      test: wget -nv --tries=1 --spider http://127.0.0.1:3000/api/v1/stats || exit 1
      interval: 30s
      timeout: 5s
      retries: 2
    logging:
      options: { max-size: "100m", max-file: "3" }
    depends_on:
      invidious-db:
        condition: service_healthy
      companion:
        condition: service_started

  companion:
    image: quay.io/invidious/invidious-companion:${COMPANION_TAG:-latest}
    restart: unless-stopped
    environment:
      - SERVER_SECRET_KEY=${COMPANION_KEY}
    logging:
      options: { max-size: "100m", max-file: "3" }
    cap_drop: [ALL]
    read_only: true
    volumes:
      - companioncache:/var/tmp/youtubei.js:rw
    security_opt:
      - no-new-privileges:true

  invidious-db:
    image: docker.io/library/postgres:14
    restart: unless-stopped
    volumes:
      - postgresdata:/var/lib/postgresql/data
      - ./upstream/config/sql:/config/sql:ro
      - ./upstream/docker/init-invidious-db.sh:/docker-entrypoint-initdb.d/init-invidious-db.sh:ro
    environment:
      POSTGRES_DB: invidious
      POSTGRES_USER: kemal
      POSTGRES_PASSWORD: kemal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgresdata:
  companioncache:
